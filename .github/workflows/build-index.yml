name: Build Vault Index

on:
  push:
    paths:
      - 'Hacking Learn/**'
      - '.github/workflows/**'

jobs:
  build-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build index
        run: |
          python3 - <<'PY'
          import os, json
          root = "Hacking Learn"
          out = []
          for dirpath, dirs, files in os.walk(root):
              for f in files:
                  if f.lower().endswith(('.md','.markdown','.txt')):
                      rel = os.path.join(dirpath, f).replace("\\\\","/")
                      raw = f"https://raw.githubusercontent.com/${{GITHUB_REPOSITORY}}/${{GITHUB_REF_NAME}}/{rel}"
                      out.append({"path": rel, "raw_url": raw})
          with open("vault_index.json","w",encoding="utf-8") as fh:
              json.dump({"generated_by":"build-index","files":out}, fh, indent=2, ensure_ascii=False)
          print("WROTE vault_index.json with", len(out), "entries")
          PY

      - name: Commit index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vault_index.json || true
          git commit -m "Update vault_index.json" || echo "no changes"
          git push origin HEAD:${{ github.ref_name }} || echo "push failed"
